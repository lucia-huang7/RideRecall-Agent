<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1235" height="1130" viewBox="0 0 1235 1130" role="img" aria-labelledby="title desc">
  <title id="title">RideRecall-Agent application architecture</title>
  <desc id="desc">Vue calls FastAPI. Case context and intent feed the agent executor, which calls role-scoped read-only policy and MCP tools and consumes their results. The response composer checks citations. Separate case commands require specialist decisions and rider confirmation. SQLite commits case state, memory, receipts and an outbox; Chroma holds policy and derived memory indexes. Subsequent requests restore saved context.</desc>
