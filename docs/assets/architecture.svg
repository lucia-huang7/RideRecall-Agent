      <path d="M0 0 L8 4 L0 8" fill="#1947b5" />
    </marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="#00866b" />
    </marker>
    <marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="#d14826" />
    </marker>
  </defs>
