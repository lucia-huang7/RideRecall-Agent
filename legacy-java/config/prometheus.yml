global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kinderuber-java
    environment: production

scrape_configs:
  - job_name: kinderuber-java-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - kinderuber-java:8080
        labels:
          service: kinderuber-java

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
