name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      container:
        description: Build and exercise the isolated container workflow
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --require-hashes -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
      - name: Python style and import checks
        run: |
          python -m ruff check backend scripts
          python -m ruff format --check backend scripts
      - name: Published evaluation evidence
        run: python scripts/ops/check-evaluation-evidence.py
      - name: Backend checks
        working-directory: backend
        run: python -m pytest tests -q -W error
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build
      - name: Container workflow
        if: inputs.container
        run: |
          docker compose build app
          python scripts/ops/check-container.py
