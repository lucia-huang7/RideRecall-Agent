<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc"><title id="title">Case analysis and controlled state transitions</title><desc id="desc">Requests restore durable case context, run agent analysis with read-only policy and MCP evidence, validate results and commit SQLite state. Explicit staff and rider commands guard adjustments. An outbox updates derived Chroma projections.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#536373"/></marker></defs><rect width="1100" height="575" fill="#f7f9fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="15" font-weight="700" fill="#536373" text-anchor="start">CASE ANALYSIS</text><text x="32" y="70" font-size="26" font-weight="600" fill="#17212b" text-anchor="start">Request → case context → analysis → saved result</text><rect x="32" y="112" width="226" height="90" rx="8" fill="white" stroke="#bdc8d2"/><text x="50" y="145" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">FastAPI</text><text x="50" y="172" font-size="15" font-weight="400" fill="#536373" text-anchor="start">Rider / staff requests</text><rect x="302" y="112" width="226" height="90" rx="8" fill="white" stroke="#bdc8d2"/><text x="320" y="145" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">Case context</text><text x="320" y="172" font-size="15" font-weight="400" fill="#536373" text-anchor="start">SQLite state + claim versions</text><rect x="572" y="112" width="226" height="90" rx="8" fill="white" stroke="#bdc8d2"/><text x="590" y="145" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">Agent analysis</text><text x="590" y="172" font-size="15" font-weight="400" fill="#536373" text-anchor="start">Intent + scoped tools</text><rect x="842" y="112" width="226" height="90" rx="8" fill="white" stroke="#bdc8d2"/><text x="860" y="145" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">Evidence checks</text><text x="860" y="172" font-size="15" font-weight="400" fill="#536373" text-anchor="start">Citations + tool results</text><path d="M258 157 H302" fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 157 H572" fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"/><path d="M798 157 H842" fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="239" font-size="17" font-weight="400" fill="#536373" text-anchor="start">Vue client: rider workflow · specialist desk · operator diagnostics</text><rect x="542" y="280" width="270" height="94" rx="8" fill="white" stroke="#bdc8d2"/><text x="560" y="313" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">Read-only evidence</text><text x="560" y="340" font-size="15" font-weight="400" fill="#536373" text-anchor="start">Chroma policies + stdio MCP</text><path d="M685 280 V204" fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="325" font-size="15" font-weight="700" fill="#536373" text-anchor="start">STAFF AND RIDER ACTIONS</text><rect x="32" y="348" width="440" height="94" rx="8" fill="white" stroke="#bdc8d2"/><text x="50" y="381" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">Case actions</text><text x="50" y="408" font-size="15" font-weight="400" fill="#536373" text-anchor="start">Staff decision → rider confirmation</text><rect x="842" y="348" width="226" height="94" rx="8" fill="white" stroke="#bdc8d2"/><text x="860" y="381" font-size="20" font-weight="600" fill="#17212b" text-anchor="start">SQLite commit</text><text x="860" y="408" font-size="15" font-weight="400" fill="#536373" text-anchor="start">Case + receipt + outbox</text><path d="M955 202 V346" fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"/><path d="M472 395 H840" fill="none" stroke="#536373" stroke-width="2" ma