server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kinderuber-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:anthropic}
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:kinderuber123}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

kinderuber:
  llm:
    fallback-enabled: ${LLM_FALLBACK_ENABLED:true}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
    max-input-tokens: ${LLM_MAX_INPUT_TOKENS:48000}
    max-background-tokens: ${LLM_MAX_BACKGROUND_TOKENS:4000}
    max-tool-result-tokens: ${LLM_MAX_TOOL_RESULT_TOKENS:2000}
  memory:
    ttl-seconds: ${MEMORY_TTL_SECONDS:86400}
    working-max: ${MEMORY_WORKING_MAX:20}
    compress-at: ${MEMORY_COMPRESS_AT:15}
  rag:
    top-k: ${RAG_TOP_K:4}
    bm25-weight: ${RAG_BM25_WEIGHT:0.45}
    vector-weight: ${RAG_VECTOR_WEIGHT:0.55}
  storage:
    data-dir: ${KINDER_UBER_DATA_DIR:data/java}
    knowledge-path: ${KNOWLEDGE_STORE_PATH:${KINDER_UBER_DATA_DIR:data/java}/knowledge-store.json}
    memory-path: ${MEMORY_STORE_PATH:${KINDER_UBER_DATA_DIR:data/java}/memory-store.json}
  monitor:
    success-rate-threshold: ${MONITOR_SUCCESS_RATE_THRESHOLD:0.90}
    latency-ms-threshold: ${MONITOR_LATENCY_MS_THRESHOLD:3000}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    fallback-penalty: ${KINDER_UBER_MONITOR_FALLBACK_PENALTY:0.5}
    cooldown-seconds: ${KINDER_UBER_MONITOR_COOLDOWN_SECONDS:60}
  eval:
    baseline-path: ${EVAL_BASELINE_PATH:data/eval/baseline.json}
  skills:
    root-dir: ${KINDER_UBER_SKILLS_DIR:skills}
    max-prompt-chars: ${KINDER_UBER_SKILLS_MAX_PROMPT_CHARS:5000}

langchain4j:
  anthropic:
    chat-model:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model-name: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  deepseek:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/anthropic}
      model-name: ${DEEPSEEK_MODEL:deepseek-flash}
