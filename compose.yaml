# Authenticated fictional preview. No model key or real payment integration.
name: riderecall-agent
services:
  init:
    profiles: [tools]
    image: riderecall-agent:local
    command: [python, /app/scripts/ops/provision-auth-preview.py, --output, /config/profile]
    environment:
      RIDERECALL_AGENT_ENV: development
    volumes:
      - configuration:/config
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
  app:
    image: riderecall-agent:local
    build: .
    environment:
      RIDERECALL_AGENT_ENV: production
      RIDERECALL_AGENT_RIDE_MODEL_MODE: demo
      RIDERECALL_AGENT_RIDE_DB: /data/state.sqlite3
      RIDERECALL_AGENT_IDENTITY_FILE: /config/profile/identities.json
      RIDERECALL_AGENT_RIDE_CATALOG_PATH: /config/profile/catalog.json
    ports: ['127.0.0.1:${RIDERECALL_AGENT_HTTP_PORT:-8013}:8000']
    volumes:
      - state:/data
      - configuration:/config:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  state:
  configuration:
