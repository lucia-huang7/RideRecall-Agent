services:
  redis:
    image: redis:7-alpine
    container_name: kinderuber-java-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-kinderuber123}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kinderuber123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: kinderuber-java-chromadb
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  kinderuber-java:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinderuber-java-app
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_BASE_URL=http://chromadb:8000
      - CHROMA_API_VERSION=V2
      - SEMANTIC_STORAGE_MODE=chroma
      - KINDER_UBER_DATA_DIR=/app/data/java
      - KNOWLEDGE_STORE_PATH=/app/data/java/knowledge-store.json
      - MEMORY_STORE_PATH=/app/data/java/memory-store.json
      - LLM_FALLBACK_ENABLED=true
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-anthropic}
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: kinderuber-java-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      kinderuber-java:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: kinderuber-java-nginx
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      kinderuber-java:
        condition: service_started

volumes:
  redis-data:
  chromadb-data:
  app-data:
  prometheus-data:
